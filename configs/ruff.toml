line-length = 100
target-version = "py311"
extend-exclude = [
  ".debt",
  ".venv",
  "venv",
  "build",
  "dist",
  "node_modules"
]

[lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                  # import sorting
  "B",                  # bugbear
  "UP",                 # pyupgrade
  "SIM",                # simplification
  "C4",                 # comprehensions
  "PIE",                # misc quality
  "RET",                # return statements
  "RUF"                 # Ruff-specific
]
ignore = [
  "E501"                # line length handled as a soft convention; tune per repo
]

[lint.per-file-ignores]
"tests/**" = ["S101"]
